name: cloud-drive-backend-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloud_drive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud-drive-local-db}
      POSTGRES_DB: ${POSTGRES_DB:-cloud_drive}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    build: ./infra/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cloud-drive-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cloud-drive-local-storage}
    ports:
      - "127.0.0.1:${MINIO_PORT:-59000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9000/minio/health/ready']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  minio-data:
